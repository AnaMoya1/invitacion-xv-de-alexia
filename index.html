<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis 15 Años</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .invitacion {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;

            background-image: url("invitacion.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            padding: 30px 20px 50px;
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }

        button,
        .whatsapp,
        .ubicacion {
            border: none;
            border-radius: 30px;
            padding: 15px 25px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
            width: 100%;
            transition: transform 0.2s;
        }

        button:active,
        .whatsapp:active,
        .ubicacion:active {
            transform: scale(0.95);
        }

        .ubicacion {
            background: rgba(255, 255, 255, 0.92);
            color: #333;
        }

        .whatsapp {
            background: #25D366;
            color: white;
        }
    </style>
</head>

<body>

    <div class="invitacion">

        <div class="botones">

            <!-- BOTÓN DE UBICACIÓN -->
            <a
                class="ubicacion"
                href="https://maps.app.goo.gl/tFyQPV3e8qgu5CUC8"
                target="_blank">
                📍 Ver ubicación
            </a>

            <!-- BOTÓN DE WHATSAPP -->
            <a
                class="whatsapp"
                href="https://wa.me/59173681321"
                target="_blank">
                💌 Confirmar asistencia
            </a>

        </div>

    </div>

    <!-- MÚSICA OCULTA -->
    <audio id="musica" autoplay loop>
        <source src="musica.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <script>

        const audio = document.getElementById("musica");

        // Intentar reproducir automáticamente
        window.addEventListener("load", function() {
            audio.play().catch(function() {
                console.log("El navegador bloqueó la reproducción automática.");
            });
        });

        // Si el navegador bloquea el autoplay,
        // la música comenzará con el primer toque.
        document.addEventListener("click", function iniciarMusica() {
            audio.play().catch(function() {});
        }, { once: true });

        document.addEventListener("touchstart", function iniciarMusica() {
            audio.play().catch(function() {});
        }, { once: true });

    </script>

</body>
</html>
